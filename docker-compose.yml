services:
  postgres:
    image: postgres:16-alpine
    container_name: nicka-ml-postgres
    environment:
      - POSTGRES_DB=nichka_ml
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Fabricio.2312
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nichka_ml"]
      interval: 10s
      timeout: 5s
      retries: 5

  nicka-ml:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nicka-ml-service
    ports:
      - "8001:8001"
    volumes:
      - ./models:/app/models
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data: